name: ARKAN Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1'
      - name: Install LibreDWG build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git ninja-build file unzip
      - name: Get LibreDWG 0.14 source
        run: |
          git clone --recurse-submodules --depth 1 --branch 0.14 https://github.com/LibreDWG/libredwg.git libredwg
          git -C libredwg submodule update --init --recursive
      - name: Build LibreDWG Android ARM64 converters
        run: |
          cmake -S libredwg -B build-libredwg -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DBUILD_SHARED_LIBS=OFF \
            -DLIBREDWG_LIBONLY=OFF \
            -DLIBREDWG_DISABLE_WRITE=OFF \
            -DLIBREDWG_DISABLE_JSON=OFF \
            -DBUILD_TESTING=OFF \
            -DENABLE_LTO=OFF \
            -DDISABLE_WERROR=ON
          cmake --build build-libredwg --target dwg2dxf dxf2dwg --parallel 2
          mkdir -p app/src/main/jniLibs/arm64-v8a
          DWG2DXF="$(find build-libredwg -type f -name dwg2dxf -perm -u+x | head -n 1)"
          DXF2DWG="$(find build-libredwg -type f -name dxf2dwg -perm -u+x | head -n 1)"
          test -n "$DWG2DXF" && test -s "$DWG2DXF"
          test -n "$DXF2DWG" && test -s "$DXF2DWG"
          cp "$DWG2DXF" app/src/main/jniLibs/arm64-v8a/libdwg2dxf.so
          cp "$DXF2DWG" app/src/main/jniLibs/arm64-v8a/libdxf2dwg.so
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" app/src/main/jniLibs/arm64-v8a/libdwg2dxf.so app/src/main/jniLibs/arm64-v8a/libdxf2dwg.so
          file app/src/main/jniLibs/arm64-v8a/libdwg2dxf.so app/src/main/jniLibs/arm64-v8a/libdxf2dwg.so
          test -s app/src/main/jniLibs/arm64-v8a/libdwg2dxf.so
          test -s app/src/main/jniLibs/arm64-v8a/libdxf2dwg.so
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Verify DWG tools are packaged in APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/lib(dwg2dxf|dxf2dwg)\\.so$'
          mkdir -p "$RUNNER_TEMP/dwg-verify"
          unzip -p "$APK" lib/arm64-v8a/libdwg2dxf.so > "$RUNNER_TEMP/dwg-verify/dwg2dxf"
          unzip -p "$APK" lib/arm64-v8a/libdxf2dwg.so > "$RUNNER_TEMP/dwg-verify/dxf2dwg"
          test -s "$RUNNER_TEMP/dwg-verify/dwg2dxf"
          test -s "$RUNNER_TEMP/dwg-verify/dxf2dwg"
      - name: Sign APK with permanent ARKAN key
        env:
          ARKAN_KEYSTORE_BASE64: ${{ secrets.ARKAN_KEYSTORE_BASE64 }}
          ARKAN_KEYSTORE_PASSWORD: ${{ secrets.ARKAN_KEYSTORE_PASSWORD }}
          ARKAN_KEY_ALIAS: ${{ secrets.ARKAN_KEY_ALIAS }}
        run: |
          test -n "$ARKAN_KEYSTORE_BASE64" || (echo "Missing ARKAN_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$ARKAN_KEYSTORE_PASSWORD" || (echo "Missing ARKAN_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$ARKAN_KEY_ALIAS" || (echo "Missing ARKAN_KEY_ALIAS secret" && exit 1)
          echo "$ARKAN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/arkan-release.jks"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -f 4 app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/arkan-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/arkan-release.jks" --ks-key-alias "$ARKAN_KEY_ALIAS" --ks-pass env:ARKAN_KEYSTORE_PASSWORD --key-pass env:ARKAN_KEYSTORE_PASSWORD --out app/build/outputs/apk/debug/ARKAN-CAD-PRO.apk "$RUNNER_TEMP/arkan-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose app/build/outputs/apk/debug/ARKAN-CAD-PRO.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARKAN-CAD-PRO-stable-signed-apk
          path: app/build/outputs/apk/debug/ARKAN-CAD-PRO.apk
          if-no-files-found: error
          retention-days: 7
