name: ARKAN Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Sign APK with permanent ARKAN key
        env:
          ARKAN_KEYSTORE_BASE64: ${{ secrets.ARKAN_KEYSTORE_BASE64 }}
          ARKAN_KEYSTORE_PASSWORD: ${{ secrets.ARKAN_KEYSTORE_PASSWORD }}
          ARKAN_KEY_ALIAS: ${{ secrets.ARKAN_KEY_ALIAS }}
        run: |
          test -n "$ARKAN_KEYSTORE_BASE64" || (echo "Missing ARKAN_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$ARKAN_KEYSTORE_PASSWORD" || (echo "Missing ARKAN_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$ARKAN_KEY_ALIAS" || (echo "Missing ARKAN_KEY_ALIAS secret" && exit 1)
          echo "$ARKAN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/arkan-release.jks"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -f 4 app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/arkan-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/arkan-release.jks" --ks-key-alias "$ARKAN_KEY_ALIAS" --ks-pass env:ARKAN_KEYSTORE_PASSWORD --key-pass env:ARKAN_KEYSTORE_PASSWORD --out app/build/outputs/apk/debug/ARKAN-CAD-PRO.apk "$RUNNER_TEMP/arkan-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose app/build/outputs/apk/debug/ARKAN-CAD-PRO.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARKAN-CAD-PRO-stable-signed-apk
          path: app/build/outputs/apk/debug/ARKAN-CAD-PRO.apk
          if-no-files-found: error
